<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <title>ShareLink 自适应图标前景</title>
  <defs>
    <linearGradient id="fg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#38d9c0"/>
    </linearGradient>
  </defs>
  <!-- 与 static/icons/app-icon.svg 同一套字形（512 网格），缩到画布的 ~47%
       （自适应图标画布 108dp、安全区是中间 72dp；放太大时在圆/圆角遮罩里会显得标志顶到图标边缘） -->
  <g transform="translate(54 54) scale(0.16) translate(-256 -256)"
     fill="none" stroke="url(#fg-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216 172h-36a84 84 0 0 0 0 168h36"/>
    <path d="M296 172h36a84 84 0 0 1 0 168h-36"/>
    <path d="M204 256h104"/>
  </g>
</svg>
